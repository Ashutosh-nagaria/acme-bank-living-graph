<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acme Bank — Living Infrastructure Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a22;
    --border: #22303c;
    --text: #e6edf3;
    --muted: #8b98a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header span {
    color: var(--muted);
    font-size: 13px;
  }
  #graph {
    width: 100%;
    height: calc(100vh - 61px);
  }
  #legend {
    position: absolute;
    bottom: 24px;
    left: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 12px;
    line-height: 1.9;
    z-index: 10;
  }
  #legend .section-title {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 8px 0 4px 0;
  }
  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
  }
  .line {
    display: inline-block;
    width: 18px;
    height: 0;
    border-top: 2px solid var(--muted);
    margin-right: 8px;
    vertical-align: middle;
  }
  #status {
    position: absolute;
    top: 72px;
    right: 24px;
    font-size: 12px;
    color: var(--muted);
    z-index: 10;
  }
  #discoverBtn {
    position: absolute;
    bottom: 24px;
    right: 24px;
    z-index: 10;
    background: #4f8cff;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(79, 140, 255, 0.35);
  }
  #discoverBtn:hover {
    background: #3d7ae8;
  }
  #discoverBtn:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>
</head>
<body>
  <header>
    <h1>Acme Bank — Living Infrastructure Graph</h1>
    <span>Discovery / CMDB visualization</span>
  </header>
  <div id="graph"></div>
  <div id="status">Loading graph...</div>
  <button id="discoverBtn">Simulate Asset Discovery</button>
  <div id="legend">
    <div class="section-title">Node type</div>
    <div><span class="dot" style="background:#4f8cff"></span>Application</div>
    <div><span class="dot" style="background:#4caf7d"></span>Database</div>
    <div><span class="dot" style="background:#c98a3e"></span>Load Balancer</div>
    <div><span class="dot" style="background:#8b95a1"></span>Server</div>
    <div><span class="dot" style="background:#a06fd1"></span>Storage</div>
    <div class="section-title">Relationship</div>
    <div><span class="line" style="border-top-style:solid"></span>depends_on</div>
    <div><span class="line" style="border-top-style:dashed"></span>connects_to</div>
    <div><span class="line" style="border-top-style:solid;border-color:#c98a3e"></span>routes_to</div>
    <div><span class="line" style="border-top-style:dotted"></span>inherits_from</div>
  </div>

  <script>
    const groupColors = {
      Application: "#4f8cff",
      Database: "#4caf7d",
      LoadBalancer: "#c98a3e",
      Server: "#8b95a1",
      Storage: "#a06fd1"
    };

    const edgeStyle = {
      depends_on: { dashes: false, color: "#5b6b78" },
      connects_to: { dashes: [4, 4], color: "#5b6b78" },
      routes_to: { dashes: false, color: "#c98a3e" },
      inherits_from: { dashes: [1, 4], color: "#5b6b78" }
    };

    let nodes, edges, network;

    async function loadGraph() {
      const statusEl = document.getElementById("status");
      try {
        const res = await fetch("/api/graph-data");
        if (!res.ok) {
          const errBody = await res.text();
          throw new Error("Request failed: " + res.status + " " + errBody);
        }
        const data = await res.json();

        nodes = new vis.DataSet(data.nodes.map(n => ({
          id: n.id,
          label: n.label,
          shape: "dot",
          size: 16,
          color: {
            background: groupColors[n.group] || "#666",
            border: "#0b0f14",
            highlight: { background: groupColors[n.group] || "#666", border: "#fff" }
          },
          font: { color: "#e6edf3", size: 12 }
        })));

        edges = new vis.DataSet(data.edges.map(e => {
          const style = edgeStyle[e.label] || { dashes: false, color: "#5b6b78" };
          return {
            id: e.id,
            from: e.from,
            to: e.to,
            arrows: "to",
            dashes: style.dashes,
            color: { color: style.color, opacity: 0.7 },
            smooth: { type: "continuous" }
          };
        }));

        const container = document.getElementById("graph");
        network = new vis.Network(container, { nodes, edges }, {
          physics: {
            enabled: true,
            barnesHut: {
              gravitationalConstant: -12000,
              springLength: 140,
              springConstant: 0.03,
              damping: 0.25,
              avoidOverlap: 0.4
            },
            stabilization: { iterations: 150 }
          },
          interaction: { hover: true, tooltipDelay: 100 },
          nodes: { borderWidth: 2 },
          edges: { width: 1.5 }
        });

        statusEl.textContent = data.nodes.length + " assets, " + data.edges.length + " relationships";
        setTimeout(() => { statusEl.style.display = "none"; }, 2500);
      } catch (err) {
        statusEl.textContent = "Failed to load graph: " + err.message;
        console.error(err);
      }
    }

    loadGraph();

    const discoverBtn = document.getElementById("discoverBtn");
    discoverBtn.addEventListener("click", async () => {
      discoverBtn.disabled = true;
      try {
        const res = await fetch("/api/discover-asset");
        if (!res.ok) throw new Error("Request failed: " + res.status);
        const data = await res.json();

        if (data.action === "added") {
          nodes.add({
            id: data.node.id,
            label: data.node.label,
            shape: "dot",
            size: 16,
            color: {
              background: groupColors[data.node.group] || "#666",
              border: "#0b0f14",
              highlight: { background: groupColors[data.node.group] || "#666", border: "#fff" }
            },
            font: { color: "#e6edf3", size: 12 }
          });
          const style = edgeStyle[data.edge.label] || { dashes: false, color: "#5b6b78" };
          edges.add({
            id: data.edge.id,
            from: data.edge.from,
            to: data.edge.to,
            arrows: "to",
            dashes: style.dashes,
            color: { color: style.color, opacity: 0.7 },
            smooth: { type: "continuous" }
          });
          network.stabilize();
          discoverBtn.textContent = "Remove Discovered Asset";
        } else if (data.action === "removed") {
          nodes.remove(data.nodeId);
          discoverBtn.textContent = "Simulate Asset Discovery";
        }
      } catch (err) {
        console.error(err);
        alert("Discovery action failed: " + err.message);
      } finally {
        discoverBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
