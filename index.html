<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acme Bank — Living Infrastructure Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a22;
    --border: #22303c;
    --text: #e6edf3;
    --muted: #8b98a5;
  }
  html[data-theme="light"] {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --border: #d7dee5;
    --text: #1a2027;
    --muted: #5b6b78;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    position: relative;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header span {
    color: var(--muted);
    font-size: 13px;
  }
  #graph {
    width: 100%;
    height: calc(100vh - 61px);
  }
  #legend {
    position: absolute;
    bottom: 24px;
    left: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 12px;
    line-height: 1.9;
    z-index: 10;
  }
  #legend .section-title {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 8px 0 4px 0;
  }
  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
  }
  .line {
    display: inline-block;
    width: 18px;
    height: 0;
    border-top: 2px solid var(--muted);
    margin-right: 8px;
    vertical-align: middle;
  }
  #status {
    position: absolute;
    top: 72px;
    right: 24px;
    font-size: 12px;
    color: var(--muted);
    z-index: 10;
  }
  #discoverBtn {
    position: absolute;
    top: 50%;
    right: 28px;
    transform: translateY(-50%);
    z-index: 10;
    background: #4f8cff;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 16px 26px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(79, 140, 255, 0.4);
  }
  #discoverBtn:hover {
    background: #3d7ae8;
  }
  #discoverBtn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #themeToggle {
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <h1>Acme Bank — Living Infrastructure Graph</h1>
    <span>Discovery / CMDB visualization</span>
    <button id="themeToggle">🌙 Dark</button>
  </header>
  <div id="graph"></div>
  <div id="status">Loading graph...</div>
  <button id="discoverBtn">Simulate Asset Discovery</button>
  <div id="legend">
    <div class="section-title">Node type</div>
    <div><span class="dot" style="background:#4f8cff"></span>Application</div>
    <div><span class="dot" style="background:#4caf7d"></span>Database</div>
    <div><span class="dot" style="background:#c98a3e"></span>Load Balancer</div>
    <div><span class="dot" style="background:#8b95a1"></span>Server</div>
    <div><span class="dot" style="background:#a06fd1"></span>Storage</div>
    <div class="section-title">Relationship</div>
    <div><span class="line" style="border-top-style:solid"></span>depends_on</div>
    <div><span class="line" style="border-top-style:dashed"></span>connects_to</div>
    <div><span class="line" style="border-top-style:solid;border-color:#c98a3e"></span>routes_to</div>
    <div><span class="line" style="border-top-style:dotted"></span>inherits_from</div>
  </div>

  <script>
    const groupColors = {
      Application: "#4f8cff",
      Database: "#4caf7d",
      LoadBalancer: "#c98a3e",
      Server: "#8b95a1",
      Storage: "#a06fd1"
    };

    const edgeDash = {
      depends_on: false,
      connects_to: [4, 4],
      routes_to: false,
      inherits_from: [1, 4]
    };

    const themeColors = {
      dark: { nodeBorder: "#0b0f14", nodeFont: "#e6edf3", edgeColor: "#5b6b78", routeColor: "#c98a3e" },
      light: { nodeBorder: "#f5f7fa", nodeFont: "#1a2027", edgeColor: "#94a3b8", routeColor: "#c98a3e" }
    };

    let currentTheme = localStorage.getItem("acme-graph-theme") || "dark";
    document.documentElement.setAttribute("data-theme", currentTheme);

    function nodeColorFor(group) {
      const t = themeColors[currentTheme];
      const bg = groupColors[group] || "#666";
      return {
        background: bg,
        border: t.nodeBorder,
        highlight: { background: bg, border: "#ffffff" }
      };
    }

    function edgeColorFor(label) {
      const t = themeColors[currentTheme];
      return { color: label === "routes_to" ? t.routeColor : t.edgeColor, opacity: 0.7 };
    }

    let nodes, edges, network;

    async function loadGraph() {
      const statusEl = document.getElementById("status");
      try {
        const res = await fetch("/api/graph-data");
        if (!res.ok) {
          const errBody = await res.text();
          throw new Error("Request failed: " + res.status + " " + errBody);
        }
        const data = await res.json();

        nodes = new vis.DataSet(data.nodes.map(n => ({
          id: n.id,
          label: n.label,
          group: n.group,
          shape: "dot",
          size: 16,
          color: nodeColorFor(n.group),
          font: { color: themeColors[currentTheme].nodeFont, size: 12 }
        })));

        edges = new vis.DataSet(data.edges.map(e => ({
          id: e.id,
          from: e.from,
          to: e.to,
          relType: e.label,
          arrows: "to",
          dashes: edgeDash[e.label] ?? false,
          color: edgeColorFor(e.label),
          smooth: { type: "continuous" }
        })));

        const container = document.getElementById("graph");
        network = new vis.Network(container, { nodes, edges }, {
          physics: {
            enabled: true,
            barnesHut: {
              gravitationalConstant: -12000,
              springLength: 140,
              springConstant: 0.03,
              damping: 0.25,
              avoidOverlap: 0.4
            },
            stabilization: { iterations: 150 }
          },
          interaction: { hover: true, tooltipDelay: 100 },
          nodes: { borderWidth: 2 },
          edges: { width: 1.5 }
        });

        network.on("click", params => {
          if (params.nodes.length > 0) {
            highlightBlastRadius(params.nodes[0]);
          } else {
            clearBlastRadius();
          }
        });

        statusEl.textContent = data.nodes.length + " assets, " + data.edges.length + " relationships";
        setTimeout(() => { statusEl.style.display = "none"; }, 2500);
      } catch (err) {
        statusEl.textContent = "Failed to load graph: " + err.message;
        console.error(err);
      }
    }

    function blastRadiusAncestors(clickedId) {
      const reverseAdj = {};
      edges.get().forEach(e => {
        if (!reverseAdj[e.to]) reverseAdj[e.to] = [];
        reverseAdj[e.to].push(e.from);
      });

      const affected = new Set([clickedId]);
      const queue = [clickedId];
      while (queue.length) {
        const current = queue.shift();
        (reverseAdj[current] || []).forEach(parentId => {
          if (!affected.has(parentId)) {
            affected.add(parentId);
            queue.push(parentId);
          }
        });
      }
      return affected;
    }

    function highlightBlastRadius(clickedId) {
      const affected = blastRadiusAncestors(clickedId);

      nodes.update(nodes.getIds().map(id => ({
        id,
        opacity: affected.has(id) ? 1 : 0.15
      })));

      edges.update(edges.getIds().map(id => {
        const e = edges.get(id);
        const inBlast = affected.has(e.from) && affected.has(e.to);
        return {
          id,
          color: inBlast
            ? { color: "#ff5f56", opacity: 1 }
            : { color: edgeColorFor(e.relType).color, opacity: 0.1 },
          width: inBlast ? 2.5 : 1.5
        };
      }));
    }

    function clearBlastRadius() {
      nodes.update(nodes.getIds().map(id => ({ id, opacity: 1 })));
      edges.update(edges.getIds().map(id => {
        const e = edges.get(id);
        return { id, color: edgeColorFor(e.relType), width: 1.5 };
      }));
    }

    loadGraph();

    const discoverBtn = document.getElementById("discoverBtn");
    discoverBtn.addEventListener("click", async () => {
      discoverBtn.disabled = true;
      try {
        const res = await fetch("/api/discover-asset");
        if (!res.ok) throw new Error("Request failed: " + res.status);
        const data = await res.json();

        if (data.action === "added") {
          nodes.add({
            id: data.node.id,
            label: data.node.label,
            group: data.node.group,
            shape: "dot",
            size: 16,
            color: nodeColorFor(data.node.group),
            font: { color: themeColors[currentTheme].nodeFont, size: 12 }
          });
          edges.add({
            id: data.edge.id,
            from: data.edge.from,
            to: data.edge.to,
            relType: data.edge.label,
            arrows: "to",
            dashes: edgeDash[data.edge.label] ?? false,
            color: edgeColorFor(data.edge.label),
            smooth: { type: "continuous" }
          });
          network.stabilize();
          discoverBtn.textContent = "Remove Discovered Asset";
        } else if (data.action === "removed") {
          nodes.remove(data.nodeId);
          discoverBtn.textContent = "Simulate Asset Discovery";
        }
      } catch (err) {
        console.error(err);
        alert("Discovery action failed: " + err.message);
      } finally {
        discoverBtn.disabled = false;
      }
    });
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.textContent = currentTheme === "dark" ? "☀️ Light" : "🌙 Dark";
    themeToggle.addEventListener("click", () => {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", currentTheme);
      localStorage.setItem("acme-graph-theme", currentTheme);
      themeToggle.textContent = currentTheme === "dark" ? "☀️ Light" : "🌙 Dark";

      if (nodes && edges) {
        const nodeUpdates = nodes.getIds().map(id => {
          const n = nodes.get(id);
          return {
            id,
            color: nodeColorFor(n.group),
            font: { color: themeColors[currentTheme].nodeFont, size: 12 }
          };
        });
        nodes.update(nodeUpdates);

        const edgeUpdates = edges.getIds().map(id => {
          const e = edges.get(id);
          return { id, color: edgeColorFor(e.relType) };
        });
        edges.update(edgeUpdates);
      }
    });
  </script>
</body>
</html>
